name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --project-name tailor_near_me .

      - name: Restore app files
        run: |
          git checkout -- pubspec.yaml
          git checkout -- lib/main.dart

      - name: Get packages
        run: flutter pub get

      - name: Add location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = """<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>"""

          if permissions not in s:
              s = s.replace(marker, marker + "\n    " + permissions)

          p.write_text(s)
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tailor-near-me-apk
          path: build/app/outputs/flutter-apk/app-release.apk
